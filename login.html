<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(rgba(10, 12, 35, 0.6), rgba(10, 12, 35, 0.85)),
        url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1920&q=80")
        center/cover no-repeat;
      color: white;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 25px;
    }

    .welcome h1 {
      font-size: 65px;
      font-family: cursive;
      font-weight: normal;
      background: linear-gradient(90deg, #9b6cff, #ff75c8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome p {
      font-size: 20px;
      color: #ddd;
      margin-top: -10px;
    }

    .login-box {
      width: 100%;
      max-width: 600px;
      padding: 40px;
      border-radius: 30px;

      background: rgba(50, 50, 85, 0.55);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    .lock-icon {
      width: 100px;
      height: 100px;
      border: 2px solid #d06aff;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      margin: -90px auto 25px;
      background: rgba(35, 30, 65, 0.8);
      font-size: 45px;
      box-shadow: 0 0 20px rgba(207, 106, 255, 0.4);
    }

    .login-title {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-title h2 {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .login-title p {
      color: #ccc;
      font-size: 18px;
    }

    .line {
      width: 60px;
      height: 4px;
      background: linear-gradient(90deg, #8d6cff, #ff75c8);
      margin: 20px auto;
      border-radius: 10px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-size: 18px;
      color: #eee;
    }

    .input-box {
      margin-bottom: 25px;
    }

    .input-box input {
      width: 100%;
      padding: 18px 20px;
      border-radius: 20px;

      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.08);

      color: white;
      font-size: 17px;
      outline: none;
      transition: 0.3s;
    }

    .input-box input::placeholder {
      color: #aaa;
    }

    .input-box input:focus {
      border-color: #d06aff;
      box-shadow: 0 0 15px rgba(208, 106, 255, 0.4);
    }

    .forgot {
      text-align: right;
      margin-top: -10px;
      margin-bottom: 30px;
    }

    .forgot a {
      color: #d68cff;
      text-decoration: none;
      font-size: 16px;
    }

    .login-btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 30px;

      background: linear-gradient(90deg, #715cff, #d34bcb);
      color: white;

      font-size: 22px;
      font-weight: bold;
      cursor: pointer;

      transition: 0.3s;
    }

    .login-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(180, 80, 255, 0.5);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 35px 0 25px;
      color: #ccc;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.25);
    }

    .social-login {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .social-btn {
      width: 110px;
      height: 70px;

      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);

      background: rgba(255, 255, 255, 0.05);
      color: white;

      font-size: 30px;
      cursor: pointer;
      transition: 0.3s;
    }

    .social-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }

    .register {
      text-align: center;
      margin-top: 30px;
      color: #ddd;
      font-size: 17px;
    }

    .register a {
      color: #dc7eff;
      font-weight: bold;
      text-decoration: none;
    }

    footer {
      margin-top: 60px;
      color: #bbb;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .welcome h1 {
        font-size: 48px;
      }

      .login-box {
        padding: 30px 20px;
      }

      .login-title h2 {
        font-size: 30px;
      }

      .social-btn {
        width: 85px;
      }
    }
  </style>
</head>

<body>

  <div class="welcome">
    <h1>Welcome ✦</h1>
    <p>Glad to see you again!</p>
  </div>

  <div class="login-box">

    <div class="lock-icon">🔒</div>

    <div class="login-title">
      <h2>Login</h2>
      <p>เข้าสู่ระบบเพื่อใช้งานต่อ</p>
      <div class="line"></div>
    </div>

    <form>
      <div class="input-box">
        <label>📧 อีเมล / Email</label>
        <input
          type="email"
          placeholder="example@email.com"
          required
        >
      </div>

      <div class="input-box">
        <label>🔒 รหัสผ่าน / Password</label>
        <input
          type="password"
          placeholder="••••••••"
          required
        >
      </div>

      <div class="forgot">
        <a href="#">ลืมรหัสผ่าน?</a>
      </div>

      <button type="submit" class="login-btn">
        เข้าสู่ระบบ →
      </button>
    </form>

    <div class="divider">
      <span>หรือเข้าสู่ระบบด้วย</span>
    </div>

    <div class="social-login">
      <button class="social-btn" type="button">G</button>
      <button class="social-btn" type="button">f</button>
      <button class="social-btn" type="button"></button>
    </div>

    <div class="register">
      ยังไม่มีบัญชี? <a href="#">สมัครสมาชิก</a>
    </div>

  </div>

  <footer>
    © 2026 Your Brand. All rights reserved.
  </footer>

</body>
</html>
